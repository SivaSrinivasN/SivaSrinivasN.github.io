<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
    <!-- Navigation bar with home on left and other links on right -->
    <nav>
        <!-- Home button on far left -->
        <div class="nav-left">
            {% if page.url == '/' or page.url == '/index.html' %}
            <a href="{{ '/' | relative_url }}" class="home-button home-icon-button" aria-label="Home" aria-current="page" title="Home">
                <svg width="22" height="22" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="1.75"
                     stroke-linecap="round" stroke-linejoin="round"
                     aria-hidden="true" focusable="false">
                    <path d="M5 10v9a1.5 1.5 0 0 0 1.5 1.5h11A1.5 1.5 0 0 0 19 19v-9l-7-6Z"
                          fill="currentColor" fill-opacity="0.12" stroke="none"/>
                    <path d="m3 10.5 8-7a1.5 1.5 0 0 1 2 0l8 7M5 9v10a1.5 1.5 0 0 0 1.5 1.5H9v-6a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v6h2.5A1.5 1.5 0 0 0 19 19V9"/>
                </svg>
            </a>
            {% else %}
            <a href="{{ '/' | relative_url }}" class="home-button">{{ site.name | escape }}</a>
            {% endif %}
        </div>
        
        <!-- Other navigation links on right -->
        <div class="nav-right">
            <ul>
                <li><a href="{{ '/projects/' | relative_url }}">Projects</a></li>
                <li><a href="{{ '/lectures/' | relative_url }}">Lectures</a></li>
                <li><a href="{{ '/misc/' | relative_url }}">Misc</a></li>
            </ul>
            <button class="theme-toggle" id="themeToggle">🌙</button>
        </div>
    </nav>

    <main>
        {{ content }}
    </main>

    <footer>
        <p>© {{ site.time | date: '%Y' }} {{ site.name | default: "Srinivas Nomula" }}. Hosted on GitHub Pages.</p>
    </footer>

    <!-- Dark Mode JavaScript -->
    <script>
        // Dark mode functionality
        const themeToggle = document.getElementById('themeToggle');
        
        // Get theme from localStorage or default to 'light'
        const currentTheme = localStorage.getItem('theme') || 'light';
        
        // Set initial theme
        document.documentElement.setAttribute('data-theme', currentTheme);
        updateToggleText();
        
        themeToggle.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateToggleText();
        });
        
        function updateToggleText() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            themeToggle.textContent = currentTheme === 'light' ? '🌙' : '☀️';
        }
    </script>
</body>
</html>
